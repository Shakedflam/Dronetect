<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title>Dronetect logo</title>
<desc>Dronetect drone detection emblem with tracking target and wordmark</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="40%" r="70%">
    <stop offset="0" stop-color="#0b2133"/>
    <stop offset="1" stop-color="#020910"/>
  </radialGradient>
  <linearGradient id="blue" x1="0" x2="1">
    <stop stop-color="#39b9ff"/><stop offset="1" stop-color="#078ce8"/>
  </linearGradient>
  <clipPath id="inside"><circle cx="600" cy="600" r="530"/></clipPath>
</defs>

<!-- transparent outside -->
<circle cx="600" cy="600" r="548" fill="url(#bg)"/>
<g clip-path="url(#inside)">

<!-- distant terrain -->
<path d="M78 430 L210 365 290 400 400 340 505 410 620 365 735 420 840 385 955 430 1085 375 1120 430 Z"
      fill="#123654" opacity=".72"/>
<g stroke="#12324a" stroke-width="4" opacity=".7">
  <path d="M90 515H1110"/><path d="M80 585H1120"/><path d="M105 665H1095"/>
  <path d="M160 515L70 720"/><path d="M350 515L265 760"/><path d="M515 515L475 790"/>
  <path d="M685 515L725 790"/><path d="M850 515L935 760"/><path d="M1040 515L1130 720"/>
</g>

<!-- tracking beam -->
<path d="M610 610 L835 310" stroke="#159ff2" stroke-width="14" stroke-dasharray="34 18" opacity=".95"/>

<!-- target brackets -->
<g fill="none" stroke="#ff2450" stroke-width="13" stroke-linecap="square">
  <path d="M770 260v-35h45 M900 225h45v35 M770 345v35h45 M945 345v35h-45"/>
</g>
<rect x="812" y="192" width="95" height="31" rx="3" fill="#ff2450"/>
<text x="859.5" y="214" fill="white" font-family="Arial, sans-serif" font-weight="700" font-size="18" text-anchor="middle">DRONE</text>

<!-- small target drone -->
<g fill="#fff" stroke="#dce7ef" stroke-width="3">
  <rect x="838" y="287" width="42" height="16" rx="6"/>
  <path d="M840 291L805 278 790 282 826 299ZM878 291L913 278 928 282 892 299Z"/>
  <path d="M845 301l-14 24 10 3 16-22M873 301l14 24-10 3-16-22"/>
  <circle cx="859" cy="307" r="8" fill="#07111a"/>
  <circle cx="859" cy="307" r="4" fill="#2fb7ff" stroke="none"/>
</g>

<!-- main drone -->
<g stroke="#06101a" stroke-width="8" stroke-linejoin="round">
  <path d="M455 626 L315 600 285 635 455 675 Z" fill="#f5f7f9"/>
  <path d="M745 626 L885 600 915 635 745 675 Z" fill="#f5f7f9"/>
  <path d="M480 590 L550 550 650 550 720 590 690 675 510 675 Z" fill="#f7f8fa"/>
  <path d="M510 675 L465 755 440 805 465 815 515 735 555 695Z" fill="#eef3f6"/>
  <path d="M690 675 L735 755 760 805 735 815 685 735 645 695Z" fill="#eef3f6"/>
  <rect x="282" y="575" width="55" height="105" rx="12" fill="#f7f8fa"/>
  <rect x="863" y="575" width="55" height="105" rx="12" fill="#f7f8fa"/>
</g>
<!-- propellers -->
<g fill="#f7f8fa">
  <path d="M308 565C220 545 135 558 110 575c78 14 135 16 198 5z"/>
  <path d="M308 565c88-20 173-7 198 10-78 14-135 16-198 5z"/>
  <path d="M892 565c-88-20-173-7-198 10 78 14 135 16 198 5z"/>
  <path d="M892 565c88-20 173-7 198 10-78 14-135 16-198 5z"/>
</g>
<!-- blue accents -->
<path d="M360 632h92l-8 20h-80zM748 632h92l-4 20h-80z" fill="#149ff0"/>
<!-- camera -->
<g>
  <rect x="548" y="665" width="104" height="92" rx="20" fill="#f5f7f9" stroke="#06101a" stroke-width="8"/>
  <circle cx="600" cy="711" r="33" fill="#07111a"/>
  <circle cx="600" cy="711" r="23" fill="none" stroke="#1ca9f5" stroke-width="8"/>
  <circle cx="600" cy="711" r="9" fill="#0b2133"/>
</g>

</g>

<!-- wordmark -->
<text x="600" y="920" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
      font-size="118" font-weight="900" letter-spacing="2" fill="#f6f7f8">
  DRONE<tspan fill="#169ff0">TECT</tspan>
</text>
<g stroke="#f2f5f7" stroke-width="4">
  <path d="M210 977H290"/>
  <path d="M875 977H990"/>
</g>
<text x="600" y="990" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
      font-size="28" font-weight="500" letter-spacing="16" fill="#f4f6f8">SEE TRACK PROTECT</text>
<circle cx="600" cy="600" r="548" fill="none" stroke="url(#blue)" stroke-width="22"/>
</svg>
