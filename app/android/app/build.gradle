apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def releaseSigningFile = rootProject.file('signing.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.exists()) {
    releaseSigning.load(new FileInputStream(releaseSigningFile))
}

def localPropertiesFile = rootProject.file('local.properties')
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def djiApiKey = localProperties.getProperty('DJI_API_KEY')
if (!djiApiKey?.trim()) {
    throw new GradleException('DJI_API_KEY must be set in app/android/local.properties')
}
def djiBridgeToken = localProperties.getProperty('DRONTECT_DJI_BRIDGE_TOKEN', '').trim()
if (djiBridgeToken && !(djiBridgeToken ==~ /[A-Fa-f0-9]{64}/)) {
    throw new GradleException('DRONTECT_DJI_BRIDGE_TOKEN must be 64 hex characters in app/android/local.properties')
}

// The native video-ingest client must reach the same backend the packaged
// WebView UI is built against, so it reads the SAME app/.env.android value
// rather than carrying its own copy that could silently diverge. There is
// deliberately no default: a missing or malformed value fails the build.
def androidEnvFile = rootProject.file('../.env.android')
if (!androidEnvFile.exists()) {
    throw new GradleException(
        'app/.env.android is required: copy app/.env.android.example and set ' +
        'VITE_REALTIME_SERVER_WS_URL (it configures both the WebView UI and the ' +
        'native /video/ingest client).'
    )
}
def realtimeOrigin = null
androidEnvFile.eachLine { line ->
    def trimmed = line.trim()
    if (trimmed.startsWith('#')) return
    def separator = trimmed.indexOf('=')
    if (separator <= 0) return
    if (trimmed.substring(0, separator).trim() != 'VITE_REALTIME_SERVER_WS_URL') return
    realtimeOrigin = trimmed.substring(separator + 1).trim()
}
if (!realtimeOrigin) {
    throw new GradleException('VITE_REALTIME_SERVER_WS_URL must be set in app/.env.android')
}
if (!(realtimeOrigin.startsWith('ws://') || realtimeOrigin.startsWith('wss://'))) {
    throw new GradleException(
        "VITE_REALTIME_SERVER_WS_URL must start with ws:// or wss:// (got: ${realtimeOrigin})"
    )
}

android {
    namespace "com.dronetect.app"
    compileSdk rootProject.ext.compileSdkVersion
    // AGP 8 disables BuildConfig generation by default; the native video
    // ingest client reads DRONTECT_REALTIME_WS_ORIGIN from it.
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.dronetect.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            // DJI MSDK v5 supports arm64 only. Keeping the shell arm64-only
            // prevents accidentally distributing an incompatible APK.
            abiFilters 'arm64-v8a'
        }
        manifestPlaceholders = [
            usesCleartextTraffic: "false",
            DJI_API_KEY: djiApiKey
        ]
        buildConfigField "String", "DRONTECT_REALTIME_WS_ORIGIN", "\"${realtimeOrigin}\""
        buildConfigField "String", "DRONTECT_DJI_BRIDGE_TOKEN", "\"${djiBridgeToken}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningFile.exists()) {
                storeFile file(releaseSigning['storeFile'])
                storePassword releaseSigning['storePassword']
                keyAlias releaseSigning['keyAlias']
                keyPassword releaseSigning['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Allows ws://<LAN-IP> simulator smoke tests from a debug APK.
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            if (releaseSigningFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    testImplementation "com.squareup.okhttp3:mockwebserver:3.14.9"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "com.dji:dji-sdk-v5-aircraft:5.18.0"
    compileOnly "com.dji:dji-sdk-v5-aircraft-provided:5.18.0"
    runtimeOnly "com.dji:dji-sdk-v5-networkImp:5.18.0"
    // WebSocket client for the native /video/ingest link. Pinned to the
    // version MSDK already resolves so this adds no new transitive graph.
    implementation "com.squareup.okhttp3:okhttp:3.14.9"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
